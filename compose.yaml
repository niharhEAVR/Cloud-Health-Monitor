services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    init: true
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - database
      # A non-internal attachment is required for Docker's localhost port
      # publishing; PostgreSQL itself remains only on `database`.
      - frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      # The worker needs controlled outbound access to probe public targets.
      - probe_egress
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:

networks:
  # PostgreSQL is reachable only by application services; no host port exists.
  database:
    internal: true
  # Web is the sole member; its host port remains bound to 127.0.0.1.
  frontend:
  # This is intentionally separate so only the probe worker can reach targets.
  probe_egress:
