x-runtime-environment: &runtime-environment
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-45}
  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
  WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-25000}
  MAX_SERVICES: ${MAX_SERVICES:-100}

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrate
    environment:
      NODE_ENV: production
      # The migration credential intentionally exists only in this one-shot service.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    init: true
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      target: web
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - database
      # A non-internal attachment is required for Docker's localhost port
      # publishing; PostgreSQL itself remains only on `database`.
      - frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http = require('node:http'); const host = new URL(process.env.APP_ORIGIN).host; const request = http.get('http://127.0.0.1:3000/api/health/live', { headers: { host } }, (response) => process.exit(response.statusCode === 200 ? 0 : 1)); request.on('error', () => process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *runtime-environment
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      # The worker needs controlled outbound access to probe public targets.
      - probe_egress
    healthcheck:
      # A fresh heartbeat verifies that a worker loop, not just the init process,
      # is connected and making scheduler progress.
      test:
        [
          "CMD-SHELL",
          "node -e \"const { Client } = require('pg'); const client = new Client({ connectionString: process.env.DATABASE_URL }); client.connect().then(() =\u003e client.query(\\\"SELECT EXISTS (SELECT 1 FROM worker_heartbeats WHERE last_seen_at > now() - interval '30 seconds') AS fresh\\\")).then(({ rows }) =\u003e client.end().then(() =\u003e process.exit(rows[0].fresh ? 0 : 1))).catch(() =\u003e client.end().catch(() =\u003e undefined).finally(() =\u003e process.exit(1)))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:

networks:
  # PostgreSQL is reachable only by application services; no host port exists.
  database:
    internal: true
  # Web is the sole member; its host port remains bound to 127.0.0.1.
  frontend:
  # This is intentionally separate so only the probe worker can reach targets.
  probe_egress:
