name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.12.0
  APP_ORIGIN: http://monitor.test
  DATABASE_URL: postgresql://cloud_health:cloud_health@127.0.0.1:5432/cloud_health_ci
  MIGRATION_DATABASE_URL: postgresql://cloud_health:cloud_health@127.0.0.1:5432/cloud_health_ci
  API_TEST_DATABASE_URL: postgresql://cloud_health:cloud_health@127.0.0.1:5432/cloud_health_ci
  WORKER_TEST_DATABASE_URL: postgresql://cloud_health:cloud_health@127.0.0.1:5432/cloud_health_ci
  LOG_LEVEL: warn
  DATABASE_POOL_MAX: "5"
  DATABASE_CONNECTION_TIMEOUT_MS: "5000"
  DATABASE_STATEMENT_TIMEOUT_MS: "10000"
  WORKER_CONCURRENCY: "2"
  MAX_SERVICES: "100"

jobs:
  verify:
    name: Lint, typecheck, and PostgreSQL tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: cloud_health_ci
          POSTGRES_USER: cloud_health
          POSTGRES_PASSWORD: cloud_health
        options: >-
          --health-cmd "pg_isready -U cloud_health -d cloud_health_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run unit tests
        run: npm run test -- tests/unit
      - name: Run PostgreSQL API tests
        # This is a disposable CI-only database. Tests run only up migrations
        # and scoped test operations; the workflow never runs down migrations or DROP.
        run: npm run test -- tests/api
      - name: Run PostgreSQL worker tests
        # Run after the API suite so node-pg-migrate never competes for its
        # database advisory lock with a concurrent test worker.
        run: npm run test -- tests/worker
      - name: Build production artifacts
        run: npm run build && npm run build:worker

  docker-build:
    name: Build container targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build web target
        run: docker build --target web --tag cloud-health-monitor:web-ci .
      - name: Build worker target
        run: docker build --target worker --tag cloud-health-monitor:worker-ci .
      - name: Build migration target
        run: docker build --target migrate --tag cloud-health-monitor:migrate-ci .

  compose-browser-smoke:
    name: Compose and browser smoke
    needs: docker-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Create isolated Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ORIGIN=http://127.0.0.1:3000
          DATABASE_URL=postgresql://cloud_health:ci-password@db:5432/cloud_health
          MIGRATION_DATABASE_URL=postgresql://cloud_health:ci-password@db:5432/cloud_health
          POSTGRES_DB=cloud_health
          POSTGRES_USER=cloud_health
          POSTGRES_PASSWORD=ci-password
          LOG_LEVEL=warn
          DATABASE_POOL_MAX=5
          DATABASE_CONNECTION_TIMEOUT_MS=5000
          DATABASE_STATEMENT_TIMEOUT_MS=10000
          WORKER_CONCURRENCY=2
          WORKER_LEASE_SECONDS=45
          WORKER_POLL_INTERVAL_MS=1000
          WORKER_SHUTDOWN_GRACE_MS=25000
          MAX_SERVICES=100
          EOF
      - name: Start local-only Compose stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check liveness and readiness
        run: |
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:3000/api/health/live
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:3000/api/health/ready
      - name: Install Chromium for checked-in browser journeys
        run: npx playwright install --with-deps chromium
      - name: Run checked-in desktop and mobile browser journeys
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Print Compose logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove the smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
